[theme]
font = "sans-serif"
baseRadius = "0.7rem"
buttonRadius = "0.7rem"

[theme.light]
primaryColor = "#3153D5"
backgroundColor = "#EEF3FD"
secondaryBackgroundColor = "#FAFCFF"
textColor = "#17223B"
borderColor = "#BBCBE3"

[theme.dark]
primaryColor = "#80E7FF"
backgroundColor = "#070C19"
secondaryBackgroundColor = "#111D32"
textColor = "#F2F6FF"
borderColor = "#405578"

[browser]
gatherUsageStats = false
