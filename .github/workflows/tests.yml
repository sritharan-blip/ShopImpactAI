name: App checks
on:
  push:
    paths-ignore: ['README.md', 'CHANGELOG.md', 'assets/**', 'tools/generate_banner.py']
  pull_request:
    paths-ignore: ['README.md', 'CHANGELOG.md', 'assets/**', 'tools/generate_banner.py']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q ShopImpactAI.py shopimpact
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt playwright
      - run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-previews
          path: test-results/*.png
          retention-days: 7
