name: Build app storyboard
on:
  push:
    branches: ['artifact/storyboard-20261113']
permissions:
  contents: read
jobs:
  storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt python-pptx pymupdf playwright
      - name: Install document renderer
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-liberation
          fi
      - run: python storyboard/capture.py
      - run: python storyboard/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShopImpactAI-storyboard
          path: storyboard/output/
          retention-days: 30
